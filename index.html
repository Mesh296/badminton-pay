<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Private group tool: keep it out of search engines. -->
    <meta name="robots" content="noindex" />
    <!-- The status bar follows the theme. No theme_color in the manifest: it allows one colour only,
         and the home screen app would take that light grey even in dark mode. -->
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <!-- Lets "Add to Home Screen" on iOS open the app full-screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cầu lông" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />
    <title>Tiền cầu lông</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
